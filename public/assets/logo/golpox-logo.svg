<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" width="280" height="80">
  <defs>
    <linearGradient id="logoIconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#581C87" />
    </linearGradient>
    <linearGradient id="xGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
  </defs>

  <!-- Logo Mark -->
  <g transform="translate(6, 10)">
    <rect x="0" y="0" width="60" height="60" rx="18" fill="url(#logoIconGrad)" />
    <!-- Book Icon -->
    <g fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M30 20 V48" />
      <path d="M30 24 C24 19 14 20 12 22 V46 C15 45 24 44 30 48" fill="rgba(255,255,255,0.12)" />
      <path d="M30 24 C36 19 46 20 48 22 V46 C45 45 36 44 30 48" fill="rgba(255,255,255,0.12)" />
    </g>
    <circle cx="30" cy="17" r="2.5" fill="#FBBF24" />
  </g>

  <!-- Wordmark -->
  <text x="78" y="44" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="28" fill="#1E1B4B" letter-spacing="-0.5">Golpo<tspan fill="url(#xGradient)">X</tspan></text>
  
  <!-- Bengali Tagline -->
  <text x="80" y="60" font-family="'Hind Siliguri', 'Segoe UI', sans-serif" font-weight="600" font-size="11" fill="#7C3AED" letter-spacing="0.2">বাংলা সাহিত্যের ডিজিটাল দুনিয়া</text>
</svg>
