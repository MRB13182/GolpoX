<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="glassBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333EA" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#7C3AED" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#581C87" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="glassSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#C084FC" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.5" />
    </linearGradient>
    <filter id="glassBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#581C87" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- Background with blur and gradient -->
  <rect x="6" y="6" width="88" height="88" rx="24" fill="url(#glassBg)" filter="url(#glassBlur)" stroke="url(#borderGrad)" stroke-width="2" />
  <!-- Glass Sheen Layer -->
  <path d="M 6 30 Q 35 15 94 30 L 94 6 Q 94 6 70 6 L 30 6 Q 6 6 6 30 Z" fill="url(#glassSheen)" />
  <!-- Book Symbol in Crisp White with Golden spark -->
  <g fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M50 32 V72" />
    <path d="M50 36 C42 30 26 31 24 33 V69 C27 68 41 67 50 72" fill="rgba(255,255,255,0.15)" />
    <path d="M50 36 C58 30 74 31 76 33 V69 C73 68 59 67 50 72" fill="rgba(255,255,255,0.15)" />
  </g>
  <!-- Star spark -->
  <circle cx="50" cy="27" r="3.5" fill="#FBBF24" />
</svg>
